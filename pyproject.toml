[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffi-checker"
version = "0.1.0"
description = "Learning project: ISO 26262 FFI checks on AUTOSAR ARXML and generated code, with GenAI"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]
graph = ["neo4j>=5.20"]

[project.scripts]
ffi-checker = "ffi_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["neo4j: needs a running Neo4j (set NEO4J_URI to enable)"]
